apiVersion: v1
kind: ConfigMap
metadata:
  name: keyval-operator-config
  namespace: keyval-operator-system
data:
  KEYVAL_REDIS_DIAL_TIMEOUT: "3s"
  KEYVAL_REDIS_READ_TIMEOUT: "2s"
  KEYVAL_REDIS_WRITE_TIMEOUT: "2s"
  KEYVAL_REDIS_POOL_TIMEOUT: "2s"
  KEYVAL_REDIS_OPERATION_TIMEOUT: "2s"
  KEYVAL_SENTINEL_OPERATION_TIMEOUT: "5s"
  KEYVAL_REDIS_MAX_RETRIES: "2"
  KEYVAL_REDIS_MIN_IDLE_CONNS: "1"
  KEYVAL_REDIS_RETRY_INITIAL_BACKOFF: "200ms"
  KEYVAL_REDIS_RETRY_MAX_BACKOFF: "1s"
  KEYVAL_REDIS_RETRY_BACKOFF_FACTOR: "2"
  KEYVAL_REDIS_RETRY_JITTER: "0.1"
