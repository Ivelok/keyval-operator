apiVersion: v1
kind: Namespace
metadata:
  name: keyval-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyval-operator-controller-manager
  namespace: keyval-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keyval-operator-leader-election-role
  namespace: keyval-operator-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keyval-operator-manager-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "services", "configmaps", "persistentvolumeclaims", "events", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["policy"]
    resources: ["evictions"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["keyval.ivelok.io"]
    resources: ["keyvalclusters", "keyvalclusters/status", "keyvalclusters/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keyval-operator-leader-election-rolebinding
  namespace: keyval-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keyval-operator-leader-election-role
subjects:
  - kind: ServiceAccount
    name: keyval-operator-controller-manager
    namespace: keyval-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keyval-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: keyval-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: keyval-operator-controller-manager
    namespace: keyval-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keyval-operator-controller-manager
  namespace: keyval-operator-system
  labels:
    app.kubernetes.io/name: keyval-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: keyval-operator-controller-manager
      containers:
        - name: manager
          image: ivelok/keyval-operator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect=true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
