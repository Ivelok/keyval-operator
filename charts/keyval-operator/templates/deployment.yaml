apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keyval-operator.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keyval-operator.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      {{- include "keyval-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keyval-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.manager.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.manager.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "keyval-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.manager.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          {{- $imageTag := .Values.image.tag | default .Chart.AppVersion -}}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ $imageTag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:{{ .Values.manager.metricsService.port }}
            - --health-probe-bind-address=:8081
            - --leader-elect={{ ternary "true" "false" .Values.leaderElection.enabled }}
            - --zap-devel={{ ternary "true" "false" (eq (lower .Values.manager.logLevel) "debug") }}
{{- if .Values.leaderElection.enabled }}
{{- with .Values.leaderElection.namespace }}
            - --leader-election-namespace={{ . }}
{{- end }}
{{- end }}
{{- range $arg := .Values.manager.extraArgs }}
            - {{ tpl $arg $ | quote }}
{{- end }}
          env:
            - name: WATCH_NAMESPACE
              value: {{ default "" .Values.manager.watchNamespace | quote }}
          {{- range $env := .Values.manager.env }}
            - {{- toYaml $env | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.manager.metricsService.port }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.manager.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.manager.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.manager.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.manager.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
