{{- if and .Values.rbac.create .Values.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "keyval-operator.controllerName" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keyval-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "keyval-operator.controllerName" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "keyval-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
