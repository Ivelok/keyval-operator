{{- if .Values.manager.metricsService.create }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keyval-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keyval-operator.labels" . | nindent 4 }}
    {{- with .Values.manager.metricsService.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.manager.metricsService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.manager.metricsService.type }}
  selector:
    {{- include "keyval-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.manager.metricsService.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
