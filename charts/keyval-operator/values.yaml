# Global metadata overrides
nameOverride: ""
fullnameOverride: ""
labels: {}
annotations: {}

namespace:
  create: false
  name: ""
  annotations: {}

image:
  repository: ghcr.io/ivelok/keyval-operator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

manager:
  replicas: 1
  logLevel: info
  watchNamespace: ""
  extraArgs: []
  env: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  securityContext: {}
  containerSecurityContext: {}
  extraVolumeMounts: []
  extraVolumes: []
  metricsService:
    create: true
    type: ClusterIP
    port: 8080
    annotations: {}
    labels: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

crds:
  install: true

leaderElection:
  enabled: true
  namespace: ""

examples:
  enabled: false
  namespace: ""
  clusters:
    - name: kv-sentinel
      namespace: ""
      spec:
        mode: Sentinel
        redisReplicas: 3
        sentinelCount: 3
        image: valkey/valkey:7.4
        sentinelImage: valkey/valkey:7.4
        storage:
          type: Persistent
          size: 10Gi
          storageClassName: ""
          cleanupOnDelete: false
        health:
          replicationLagSecondsMax: 5
          failoverTimeoutSeconds: 25
          minReplicasForSafety: 2
        security:
          auth:
            enabled: true
            username: ""
            passwordSecretRef:
              name: keyval-auth
              key: password
          tls:
            enabled: false
            secretName: ""
            requireClientAuth: false
            disablePlaintext: false
        redisConfig:
          appendonly: "yes"
          repl-diskless-sync: "yes"
        sentinelConfig:
          down-after-milliseconds: "5000"
          failover-timeout: "20000"
        metrics:
          enabled: true
          port: 9121
    - name: kv-standalone
      namespace: ""
      spec:
        mode: Standalone
        redisReplicas: 1
        engine: Valkey
        image: valkey/valkey:7.4
        storage:
          type: Ephemeral
        security:
          auth:
            enabled: false
        health:
          replicationLagSecondsMax: 5
          failoverTimeoutSeconds: 20
          minReplicasForSafety: 1
        metrics:
          enabled: true
          port: 9121

signing:
  cosign:
    enabled: true
    annotations: {}

release:
  registry: ghcr.io/ivelok
  repository: keyval-operator
  changelog:
    owner: ivelok
    repo: keyval-operator
    generate: true

helmTest:
  enabled: true
  image: alpine:3.20
